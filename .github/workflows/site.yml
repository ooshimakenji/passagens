name: site

# Publica a SPA no GitHub Pages. Só quando o código da tela muda: os dados vivem no branch
# `dados` e são lidos em runtime pelo raw do GitHub, então a coleta diária NÃO redeploya o
# site — era esse o ponto do desenho.
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - ".github/workflows/site.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Um deploy por vez; o mais novo vence, sem cancelar o que está no meio.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      # `vite build` compila mesmo com import faltando — o erro só aparece quando o
      # componente roda. O smoke renderiza a tela no Node e é o que pega isso.
      - name: Smoke da tela
        run: npm run smoke
        working-directory: web

      - run: npm run build
        working-directory: web

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist
      - id: deploy
        uses: actions/deploy-pages@v4
